<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>30PRAUM | Matuê Experience</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Overlay escuro para melhor contraste com o fundo -->
    <div class="overlay"></div>
    
    <!-- Container principal -->
    <div class="container" id="app">
        <div class="header">
            <div class="logo">30PRAUM <span>✦</span></div>
            <div class="sub">MATUÊ · ETERNO SÓCIO</div>
        </div>

        <div id="quizPanel">
            <!-- painel dinâmico -->
        </div>
        
        <footer>
            <p>#M4TUÊ • 30PRAUM GANG • O RETORNO DO QUARTETO</p>
        </footer>
    </div>

    <!-- Controle de música -->
    <div class="music-control" id="musicControl">
        <button id="playPauseBtn" class="music-btn">
            <span class="music-icon">🔊</span>
        </button>
        <div class="music-info">30PRAUM MODE</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
