<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>30PRAUM | Matuê Experience</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Overlay escuro para melhor contraste com o fundo -->
    <div class="overlay"></div>
    
    <!-- Container principal -->
    <div class="container" id="app">
        <div class="header">
            <div class="logo">30PRAUM <span>✦</span></div>
            <div class="sub">MATUÊ · ETERNO SÓCIO</div>
        </div>

        <div id="quizPanel">
            <!-- painel dinâmico -->
        </div>
        
        <footer>
            <p>#M4TUÊ • 30PRAUM GANG • TRABALHO ESCOLAR</p>
        </footer>
    </div>

    <!-- Botão de música flutuante -->
    <button class="music-btn" id="playPauseBtn">
        🎵 ATIVAR SOM
    </button>

    <audio id="musicaFundo" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <script src="script.js"></script>
</body>
</html>
